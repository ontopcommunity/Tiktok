<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Studio Pro | Smooth Edition</title>
    <!-- Preconnect để tăng tốc độ load ảnh/video từ CDN -->
    <link rel="preconnect" href="https://p16-sign-va.tiktokcdn.com">
    <link rel="preconnect" href="https://www.tikwm.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617; 
            color: #f8fafc;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background-color: #475569; }
        .custom-scroll-x::-webkit-scrollbar { height: 3px; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateZ(0); /* Ép Render bằng GPU */
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            
            /* SIÊU TỐI ƯU HIỆU NĂNG GRID TẠI ĐÂY */
            will-change: transform, box-shadow;
            transform: perspective(1000px) translateZ(0);
            backface-visibility: hidden; 
            content-visibility: auto; /* Bỏ qua render khi ngoài màn hình */
            contain-intrinsic-size: auto 300px; /* Giữ khung khi cuộn siêu tốc */
        }

        .glass-card:hover {
            transform: perspective(1000px) translateZ(20px) translateY(-8px);
            box-shadow: 0 30px 50px -15px rgba(0,0,0,0.7);
            border-color: rgba(236, 72, 153, 0.4);
            z-index: 10;
        }

        .glass-card:hover .play-overlay { opacity: 1; transform: scale(1); }

        @keyframes fadeUpIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { 
            animation: fadeUpIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; 
            backface-visibility: hidden; /* Giảm chớp giật lúc xuất hiện */
        }
        
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85) translateY(30px); }
            60% { opacity: 1; transform: scale(1.02) translateY(-5px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s ease; backdrop-filter: blur(8px); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { opacity: 0; transform: scale(0.85); transition: none; will-change: transform, opacity; }
        .modal-overlay.active .modal-content { animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        /* Nền tĩnh siêu nhẹ */
        .bg-blob { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.15; pointer-events: none; z-index: 0; transform: translateZ(0); }

        .tab-btn { position: relative; padding-bottom: 0.75rem; transition: all 0.3s ease; white-space: nowrap; }
        .tab-btn::after {
            content: ''; position: absolute; bottom: -1px; left: 0; width: 0%; height: 3px;
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 3px;
        }
        .tab-active { color: #fff; font-weight: 700; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .tab-active::after { width: 100%; }
        .tab-inactive { color: #64748b; font-weight: 500; }
        .tab-inactive:hover { color: #cbd5e1; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4 sm:px-6 relative selection:bg-pink-500 selection:text-white">

    <div class="bg-blob bg-pink-600 w-[500px] h-[500px] top-[-10%] left-[-10%]"></div>
    <div class="bg-blob bg-purple-600 w-[400px] h-[400px] top-[40%] right-[-10%] opacity-10"></div>
    <div class="bg-blob bg-blue-600 w-[600px] h-[600px] bottom-[-10%] left-[20%] opacity-10"></div>

    <!-- Header -->
    <div class="text-center mb-8 w-full max-w-3xl z-10 animate-fade-up">
        <div class="inline-block px-4 py-1.5 rounded-full bg-slate-800/50 border border-slate-700 text-xs font-bold tracking-widest text-pink-400 uppercase mb-4 shadow-lg">SMOOTH ENGINE</div>
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-3">
            <i class="fa-brands fa-tiktok text-white mr-2"></i>TikTok <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500">Studio</span>
        </h1>
        <p class="text-slate-400 font-medium text-sm md:text-base">Mượt mà, Sắc nét & Tối ưu hóa hiệu năng</p>
    </div>

    <!-- Bảng điều khiển -->
    <div class="w-full max-w-4xl glass-panel rounded-[2rem] p-6 sm:p-8 z-10 animate-fade-up relative overflow-hidden" style="animation-delay: 0.1s;">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500 opacity-80"></div>

        <div class="flex space-x-6 md:space-x-10 mb-8 border-b border-slate-700/50 pb-0 overflow-x-auto custom-scroll-x">
            <button onclick="switchTab('video')" id="tab-video" class="tab-btn tab-active focus:outline-none flex items-center gap-2 text-base md:text-lg">
                <i class="fa-solid fa-layer-group"></i> Box Tải Link
            </button>
            <button onclick="switchTab('search')" id="tab-search" class="tab-btn tab-inactive focus:outline-none flex items-center gap-2 text-base md:text-lg">
                <i class="fa-solid fa-magnifying-glass-chart"></i> Tìm Kiếm
            </button>
            <button onclick="switchTab('info')" id="tab-info" class="tab-btn tab-inactive focus:outline-none flex items-center gap-2 text-base md:text-lg">
                <i class="fa-solid fa-user-ninja"></i> Soi Kênh
            </button>
        </div>

        <div id="mode-video" class="transition-opacity duration-300">
            <label class="block text-sm font-semibold text-slate-300 mb-2 ml-1">Dán link video (Tối đa 20 link)</label>
            <div class="relative">
                <textarea id="tiktok-links" rows="4" placeholder="https://vt.tiktok.com/ZS..." class="w-full px-6 py-4 bg-slate-900/80 rounded-2xl focus:outline-none focus:ring-2 focus:ring-pink-500/50 transition-all resize-none mb-4 text-slate-200 placeholder-slate-600 border border-slate-700 shadow-inner custom-scroll-x"></textarea>
                <div class="absolute top-4 right-4 text-slate-500 opacity-50"><i class="fa-solid fa-link"></i></div>
            </div>
            <button id="fetch-video-btn" onclick="processVideos()" class="w-full bg-white text-black hover:bg-gray-200 font-bold py-3.5 px-6 rounded-xl transition-all transform hover:scale-[1.01] active:scale-95 flex items-center justify-center gap-2 shadow-lg">
                <i class="fa-solid fa-bolt text-pink-500"></i> Kích Hoạt Xử Lý
            </button>
        </div>

        <div id="mode-search" class="hidden transition-opacity duration-300">
            <label class="block text-sm font-semibold text-slate-300 mb-2 ml-1">Nhập từ khóa (Tên bài hát, trend...)</label>
            <div class="flex flex-col sm:flex-row gap-3 mb-2">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-slate-500"><i class="fa-solid fa-magnifying-glass"></i></div>
                    <input type="text" id="tiktok-keyword" placeholder="Ví dụ: nhạc chill, lập trình web..." class="w-full pl-12 pr-5 py-4 bg-slate-900/80 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500/50 transition-all text-slate-200 border border-slate-700 shadow-inner">
                </div>
                <div class="flex gap-2">
                    <button id="fetch-search-btn" onclick="searchTikTok(false)" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-4 px-6 rounded-xl transition-transform active:scale-95 shadow-lg flex items-center gap-2">
                        <i class="fa-solid fa-satellite-dish"></i> Quét
                    </button>
                    <button id="random-btn" onclick="searchRandom()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 px-5 rounded-xl transition-transform active:scale-95 shadow-lg flex items-center gap-2" title="Lấy 1 video ngẫu nhiên theo từ khóa">
                        <i class="fa-solid fa-dice text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="mode-info" class="hidden transition-opacity duration-300">
            <label class="block text-sm font-semibold text-slate-300 mb-2 ml-1">Nhập ID Kênh (Không cần dấu @)</label>
            <div class="flex flex-col sm:flex-row gap-3 mb-2">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-slate-500 font-bold">@</div>
                    <input type="text" id="tiktok-username" placeholder="hoaa.hanassii" class="w-full pl-10 pr-5 py-4 bg-slate-900/80 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/50 transition-all text-slate-200 border border-slate-700 shadow-inner">
                </div>
                <button id="fetch-info-btn" onclick="fetchUserInfo()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 px-8 rounded-xl transition-transform active:scale-95 shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-radar-base"></i> Soi Kênh
                </button>
            </div>
        </div>
    </div>

    <!-- UI Các trạng thái -->
    <div id="loading" class="hidden z-10 mt-6 text-center animate-fade-up">
        <div class="inline-flex items-center gap-3 bg-slate-800 border border-slate-700 px-6 py-3 rounded-full shadow-lg">
            <i class="fa-solid fa-circle-notch fa-spin text-pink-500"></i>
            <span id="loading-text" class="text-sm font-bold text-slate-200 uppercase tracking-wide">Đang xử lý...</span>
        </div>
    </div>
    <div id="error-msg" class="hidden z-10 mt-4 max-w-2xl bg-red-900/50 border border-red-500/30 text-red-400 px-6 py-3 rounded-xl shadow-md text-center text-sm font-medium animate-fade-up"></div>

    <div id="user-info-area" class="w-full max-w-4xl mx-auto z-10 mt-6 mb-6 hidden animate-fade-up"></div>

    <div id="batch-download-container" class="hidden w-full max-w-[98%] 2xl:max-w-[1600px] z-10 mt-2 flex justify-end animate-fade-up">
        <button onclick="downloadAllVideos(this)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-transform hover:-translate-y-1 flex items-center gap-2">
            <i class="fa-solid fa-boxes-packing"></i> Tải Toàn Bộ Dưới Đây
        </button>
    </div>

    <!-- Lưới Result có Contain CSS để mượt khung hình -->
    <div id="result-area" class="w-full max-w-[98%] 2xl:max-w-[1600px] mx-auto z-10 mt-6 pb-6" style="contain: content;"></div>

    <div id="load-more-container" class="hidden w-full flex justify-center z-10 pb-20 animate-fade-up">
        <button onclick="loadMore()" id="load-more-btn" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 px-8 rounded-full shadow-lg border border-slate-600 transition-transform hover:-translate-y-1 active:scale-95 flex items-center gap-2">
            <i class="fa-solid fa-angle-down"></i> Tải Thêm Video
        </button>
    </div>

    <!-- MODAL -->
    <div id="video-modal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-3 md:p-6 bg-black/85">
        <div class="modal-content glass-panel w-full max-w-5xl rounded-3xl overflow-hidden flex flex-col md:flex-row max-h-[90vh] md:max-h-[80vh] relative border border-white/10 shadow-2xl">
            <button onclick="closeModal('video-modal')" class="absolute top-3 right-3 z-30 w-9 h-9 bg-black/60 hover:bg-red-500 text-white rounded-full flex items-center justify-center transition-colors backdrop-blur-md">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="w-full md:w-1/2 bg-black relative flex items-center justify-center h-[40vh] md:h-auto" id="modal-video-container"></div>
            <div class="w-full md:w-1/2 bg-slate-900/90 flex flex-col h-[50vh] md:h-auto">
                <div id="modal-video-info" class="flex-1 overflow-y-auto custom-scroll-x p-6 md:p-8"></div>
                <div id="modal-video-actions" class="p-5 border-t border-white/10 bg-slate-900 grid grid-cols-2 gap-3"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
