<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Studio - Retro Clean</title>
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#050505">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* TẢI FONT ĐỘC QUYỀN VÀ TẮT KHỬ RĂNG CƯA ĐỂ GIỮ CHUẨN PIXEL */
        @font-face {
            font-family: 'DearPix';
            src: url('dearpix-1-94.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body { 
            background-color: #050505; 
            color: #e5e5e5; 
            font-family: 'DearPix', Courier, monospace; 
            -webkit-font-smoothing: none; 
            font-smooth: never;
            text-rendering: pixelated;
            font-size: 16px;
            overflow-x: hidden; 
        }

        ::-webkit-scrollbar { display: none; } 
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        /* UI PIXEL LÀM SẠCH (CLEAN RETRO) */
        .pixel-card { 
            background: #0a0a0a; 
            border: 2px solid #333; 
            box-shadow: 4px 4px 0px #111;
        }
        
        .pixel-input { 
            background: #000; 
            border: 2px solid #444; 
            color: #fff; 
            box-shadow: inset 2px 2px 0px #0a0a0a; 
        }
        .pixel-input:focus { border-color: #888; outline: none; }
        
        .pixel-btn { 
            background: #e0e0e0; 
            color: #000; 
            border: 2px solid #fff; 
            box-shadow: 2px 2px 0px #555; 
            cursor: pointer; 
        }
        .pixel-btn:active, .active-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px transparent !important; }
        
        .nav-dock { background: #0a0a0a; border: 2px solid #333; box-shadow: 4px 4px 0px #000; }
        .tab-btn { padding: 10px 16px; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; flex-shrink: 0; background: transparent; color: #888; transition: color 0.1s; }
        .tab-btn.pixel-tab-active { color: #fff; border-bottom: 2px solid #fff; }

        .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 640px) { .video-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
        @media (min-width: 1024px) { .video-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

        /* Bắt buộc object-contain để hiện full video/ảnh không bị cắt */
        .grid-item { background: #000; border: 2px solid #333; overflow: hidden; position: relative; cursor: pointer; aspect-ratio: 9/16; }
        .grid-item:hover { border-color: #888; transform: translate(-2px, -2px); z-index: 10; box-shadow: 4px 4px 0px #111; }
        .overlay-gradient { background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 50%); pointer-events: none; }

        .pixel-shimmer { background: #111; border: 2px solid #222; background-image: linear-gradient(90deg, #111 0px, #222 40px, #111 80px); background-size: 200% 100%; animation: shimmer 1.5s infinite linear; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* TIKTOK PLAYER */
        .tk-overlay { position: fixed; inset: 0; z-index: 999; background: #000; opacity: 0; visibility: hidden; transition: opacity 0.2s ease; display: flex; align-items: center; justify-content: center; }
        .tk-overlay.active { opacity: 1; visibility: visible; }
        .tk-container { width: 100%; height: 100dvh; max-width: 480px; background: #000; position: relative; display: flex; flex-direction: column; margin: 0 auto; overflow: hidden; }
        @media (min-width: 481px) { .tk-container { height: 92dvh; border: 2px solid #333; } }

        .tk-feed-scroller { flex: 1; width: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; background: #000; }
        .tk-feed-item { width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; background: #000; }
        
        .tk-image-scroller { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; height: 100%; scroll-behavior: smooth; pointer-events: auto; }
        .tk-slide { flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always; display: flex; align-items: center; justify-content: center; position: relative; }
        
        .tk-close-btn { position: absolute; top: 16px; left: 16px; z-index: 50; width: 40px; height: 40px; background: rgba(0,0,0,0.5); border: 2px solid #555; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; }
        
        .tk-pause-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.15s ease-out; }
        .tk-pause-icon.show { opacity: 0.8; animation: pingPause 0.2s ease-out forwards; }
        @keyframes pingPause { 0% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; } }

        .tk-sidebar { position: absolute; right: 12px; bottom: 20px; z-index: 30; display: flex; flex-direction: column; gap: 20px; align-items: center; pointer-events: auto; }
        .tk-icon-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #fff; cursor: pointer; }
        .tk-icon { font-size: 28px; filter: drop-shadow(2px 2px 0px #000); }
        .tk-avatar { width: 44px; height: 44px; border: 2px solid #fff; object-fit: cover; background: #111; }
        
        .tk-bottom-info { position: absolute; bottom: 20px; left: 14px; right: 70px; z-index: 30; color: #fff; text-shadow: 1px 1px 0px #000; pointer-events: none; }
        .tk-marquee-container { width: 120px; overflow: hidden; white-space: nowrap; }
        .tk-marquee { display: inline-block; animation: marquee 5s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .tk-action-bar { height: 60px; width: 100%; background: #0a0a0a; border-top: 2px solid #333; display: flex; align-items: center; padding: 0 12px; gap: 12px; z-index: 40; shrink-0; }
        .tk-dl-btn { flex: 1; height: 40px; background: #e0e0e0; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; gap: 8px; color: #000; cursor: pointer; }
        .tk-dl-btn:active { transform: translate(2px,2px); }

        .tk-bottom-sheet { position: absolute; bottom: -100%; left: 0; width: 100%; background: #0a0a0a; z-index: 60; transition: bottom 0.2s cubic-bezier(0.16, 1, 0.3, 1); border-top: 2px solid #333; display: flex; flex-direction: column; max-height: 80%; pointer-events: auto; }
        .tk-bottom-sheet.show { bottom: 0; box-shadow: 0px -4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="min-h-screen pb-20">

    <button id="install-app-btn" onclick="window.installWebApp()" class="hidden fixed top-5 right-5 z-[60] bg-[#e0e0e0] text-[#000] border-2 border-white px-4 py-2 flex items-center gap-2">
        CÀI APP
    </button>

    <nav class="fixed top-4 left-1/2 -translate-x-1/2 z-50 nav-dock p-1.5 flex gap-1 max-w-[95%] overflow-x-auto scrollbar-hide">
        <button onclick="window.switchTab('video')" id="tab-video" class="tab-btn pixel-tab-active">TẢI TỆP</button>
        <button onclick="window.switchTab('search')" id="tab-search" class="tab-btn">TÌM KIẾM</button>
        <button onclick="window.switchTab('info')" id="tab-info" class="tab-btn">TRA CỨU</button>
        <button onclick="window.switchTab('analytics')" id="tab-analytics" class="tab-btn">PHÂN TÍCH</button>
    </nav>

    <main class="w-full max-w-4xl mx-auto pt-24 px-4 flex flex-col items-center">
        
        <div class="text-center mb-8 w-full">
            <h1 class="text-3xl md:text-5xl mb-2 text-white">TIKTOK STUDIO</h1>
            <p class="text-[#888] text-sm">RETRO CLEAN UI</p>
        </div>

        <div class="pixel-card w-full mb-8 z-10 p-5 md:p-8">
            <div id="mode-video">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg text-white">TRUY XUẤT MEDIA</h2>
                    <div class="flex gap-2">
                        <button id="subtab-single" onclick="window.setLinkMode('single')" class="px-4 py-1.5 bg-[#e0e0e0] text-[#000] border-2 border-[#fff] shadow-[2px_2px_0_#555] active-btn">1 LINK</button>
                        <button id="subtab-multi" onclick="window.setLinkMode('multi')" class="px-4 py-1.5 bg-[#222] text-[#aaa] border-2 border-[#333] hover:bg-[#333]">NHIỀU LINK</button>
                    </div>
                </div>
                <div class="mb-4">
                    <textarea id="tiktok-links" rows="1" placeholder="Dán link Video hoặc Story vào đây..." class="w-full pixel-input p-4 text-base resize-none"></textarea>
                </div>
                <button onclick="window.processVideos()" class="w-full pixel-btn py-4 flex items-center justify-center gap-2 text-base">THỰC THI</button>
            </div>

            <div id="mode-search" class="hidden">
                <h2 class="text-lg text-white mb-4">TÌM KIẾM MẠNG LƯỚI</h2>
                <div class="flex flex-col sm:flex-row gap-4">
                    <input type="text" id="tiktok-keyword" placeholder="Nhập từ khóa..." class="w-full pixel-input p-4 text-base flex-1" onkeypress="if(event.key === 'Enter') window.searchTikTok(false)">
                    <button onclick="window.searchTikTok(false)" class="pixel-btn py-4 px-8 flex items-center justify-center gap-2 text-base">TÌM KIẾM</button>
                </div>
            </div>

            <div id="mode-info" class="hidden">
                <h2 class="text-lg text-white mb-4">TRA CỨU HỒ SƠ</h2>
                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="relative flex-1">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-[#888]">@</span>
                        <input type="text" id="tiktok-username" placeholder="Nhập ID kênh..." class="w-full pl-10 pixel-input p-4 text-base" onkeypress="if(event.key === 'Enter') window.fetchUserInfo(false)">
                    </div>
                    <button onclick="window.fetchUserInfo(false)" class="pixel-btn py-4 px-8 flex items-center justify-center gap-2 text-base">TRA CỨU</button>
                </div>
            </div>

            <div id="mode-analytics" class="hidden">
                <h2 class="text-lg text-white mb-2">PHÂN TÍCH SÂU TOÀN KÊNH</h2>
                <p class="text-xs text-[#888] mb-4 block">Quét 100% data kênh.</p>
                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="relative flex-1">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-[#888]">@</span>
                        <input type="text" id="tiktok-analytics-id" placeholder="Nhập ID mục tiêu..." class="w-full pl-10 pixel-input p-4 text-base" onkeypress="if(event.key === 'Enter') window.fetchAnalytics()">
                    </div>
                    <button onclick="window.fetchAnalytics()" class="pixel-btn py-4 px-8 text-base">BẬT RADAR</button>
                </div>
            </div>
        </div>

        <div id="error-msg" class="hidden w-full bg-[#1a0505] border-2 border-[#500] p-4 text-center text-[#f55] mb-6"></div>

        <div id="skeleton-area" class="w-full hidden">
            <div id="skel-profile" class="w-full pixel-shimmer h-40 mb-6 hidden"></div>
            <p id="loading-text" class="text-[#888] text-sm mb-6 text-center w-full animate-pulse">ĐANG KẾT NỐI...</p>
            
            <div class="w-full video-grid max-w-[98%] xl:max-w-6xl mx-auto">
                <div class="pixel-shimmer aspect-[9/16] w-full"></div>
                <div class="pixel-shimmer aspect-[9/16] w-full"></div>
                <div class="pixel-shimmer aspect-[9/16] w-full hidden sm:block"></div>
                <div class="pixel-shimmer aspect-[9/16] w-full hidden md:block"></div>
            </div>
        </div>

        <div id="user-info-area" class="w-full mb-6 hidden"></div>
        <div id="special-action-container" class="w-full max-w-[98%] xl:max-w-6xl mx-auto mb-6 hidden flex-wrap justify-center sm:justify-end items-center gap-4"></div>

        <div id="result-area" class="w-full video-grid max-w-[98%] xl:max-w-6xl mx-auto mt-4 pb-6"></div>

        <div id="scroll-sentinel" class="w-full h-2 mt-4"></div>
        <div id="load-more-indicator" class="hidden w-full text-center py-6 text-sm text-[#888] animate-pulse">ĐANG TẢI THÊM...</div>

    </main>

    <!-- TIKTOK PLAYER -->
    <div id="tk-player-modal" class="tk-overlay">
        <div class="tk-container">
            <button onclick="window.closeTkPlayer()" class="tk-close-btn"><i class="fa-solid fa-chevron-left text-xl"></i></button>
            <div id="tk-feed-scroller" class="tk-feed-scroller"></div>

            <div class="tk-action-bar">
                <div id="tk-btn-dl-media" class="tk-dl-btn">
                    <span id="tk-lbl-media">LƯU VIDEO</span>
                </div>
                <div id="tk-btn-dl-music" class="tk-dl-btn bg-[#222] text-[#fff] border-[#444] hover:bg-[#333]">
                    LƯU NHẠC
                </div>
            </div>

            <!-- SHEET ANALYTICS -->
            <div id="tk-analytics-sheet" class="tk-bottom-sheet p-6 flex flex-col" onclick="event.stopPropagation()">
                <div class="flex justify-between items-center mb-4 pb-4 border-b-2 border-[#222] shrink-0">
                    <h3 class="text-lg text-white">SYSTEM LOG</h3>
                    <div class="w-8 h-8 border border-[#444] flex items-center justify-center cursor-pointer hover:bg-[#222]" onclick="window.closeAnalyticsSheet(event)">
                        <i class="fa-solid fa-xmark text-[#888]"></i>
                    </div>
                </div>
                <div id="tk-analytics-content" class="flex-1 overflow-y-auto pb-6 scrollbar-hide"></div>
            </div>

            <!-- SHEET SHARE -->
            <div id="tk-share-sheet" class="tk-bottom-sheet p-6 flex flex-col" onclick="event.stopPropagation()">
                <div class="flex justify-between items-center mb-4 pb-4 border-b-2 border-[#222] shrink-0">
                    <h3 class="text-lg text-white">CHIA SẺ ĐẾN</h3>
                    <div class="w-8 h-8 border border-[#444] flex items-center justify-center cursor-pointer hover:bg-[#222]" onclick="window.closeShareSheet(event)">
                        <i class="fa-solid fa-xmark text-[#888]"></i>
                    </div>
                </div>
                <div id="tk-share-content" class="flex items-start gap-6 pb-6 overflow-x-auto scrollbar-hide"></div>
            </div>
            
            <!-- SHEET COMMENT -->
            <div id="tk-comment-sheet" class="tk-bottom-sheet p-5 flex flex-col h-[75vh]" onclick="event.stopPropagation()">
                <div class="flex justify-between items-center mb-4 pb-4 border-b-2 border-[#222] shrink-0">
                    <h3 class="text-lg text-white">BÌNH LUẬN [<span id="tk-comment-count">0</span>]</h3>
                    <div class="w-8 h-8 border border-[#444] flex items-center justify-center cursor-pointer hover:bg-[#222]" onclick="window.closeCommentSheet(event)">
                        <i class="fa-solid fa-xmark text-[#888]"></i>
                    </div>
                </div>
                <div id="tk-comment-content" class="flex-1 overflow-y-auto space-y-2 pb-6 scrollbar-hide relative" onscroll="if(this.scrollTop + this.clientHeight >= this.scrollHeight - 50) window.fetchComments(true)">
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
