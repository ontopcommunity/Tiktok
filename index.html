<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader & Info</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar cho phần mô tả nếu quá dài */
        .desc-box::-webkit-scrollbar {
            width: 6px;
        }
        .desc-box::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800 flex flex-col items-center py-10 px-4">

    <div class="text-center mb-8 w-full max-w-2xl">
        <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2">
            <i class="fa-brands fa-tiktok text-black mr-2"></i>TikTok Downloader
        </h1>
        <p class="text-gray-600">Dán link video TikTok vào bên dưới để lấy thông tin và tải về</p>
    </div>

    <div class="w-full max-w-2xl bg-white rounded-xl shadow-md p-4 mb-8 flex flex-col sm:flex-row gap-3">
        <input type="text" id="tiktok-link" placeholder="https://vt.tiktok.com/..." 
            class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        <button id="fetch-btn" onclick="fetchVideoData()" 
            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition flex items-center justify-center gap-2 min-w-[120px]">
            <span>Lấy dữ liệu</span>
        </button>
    </div>

    <div id="loading" class="hidden text-center mb-8">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-600 mb-2"></i>
        <p class="text-gray-500">Đang xử lý dữ liệu, vui lòng đợi...</p>
    </div>

    <div id="error-msg" class="hidden w-full max-w-2xl bg-red-100 text-red-700 p-4 rounded-lg mb-8 text-center border border-red-200">
    </div>

    <div id="result-container" class="hidden w-full max-w-4xl bg-white rounded-2xl shadow-lg overflow-hidden">
        <div class="flex flex-col md:flex-row">
            
            <div class="w-full md:w-2/5 bg-gray-900 flex items-center justify-center relative min-h-[300px]">
                <video id="main-video-player" controls autoplay loop playsinline class="w-full h-full max-h-[500px] bg-black">
                    <source id="video-source" src="" type="video/mp4">
                    Trình duyệt của bạn không hỗ trợ thẻ video.
                </video>
            </div>

            <div class="w-full md:w-3/5 p-6 flex flex-col justify-between">
                <div>
                    <div class="flex items-center gap-4 mb-6 pb-4 border-b border-gray-100">
                        <img id="author-avatar" src="" alt="Avatar" class="w-14 h-14 rounded-full border-2 border-gray-200 object-cover">
                        <div>
                            <h3 id="author-nickname" class="font-bold text-lg text-gray-900"></h3>
                            <p id="author-id" class="text-sm text-gray-500"></p>
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-4 mb-6 text-sm text-gray-600">
                        <div class="flex items-center gap-1 bg-gray-100 px-3 py-1.5 rounded-full"><i class="fa-solid fa-play text-gray-500"></i> <span id="stat-play"></span></div>
                        <div class="flex items-center gap-1 bg-gray-100 px-3 py-1.5 rounded-full"><i class="fa-solid fa-heart text-red-500"></i> <span id="stat-like"></span></div>
                        <div class="flex items-center gap-1 bg-gray-100 px-3 py-1.5 rounded-full"><i class="fa-solid fa-comment text-blue-500"></i> <span id="stat-comment"></span></div>
                        <div class="flex items-center gap-1 bg-gray-100 px-3 py-1.5 rounded-full"><i class="fa-solid fa-share text-green-500"></i> <span id="stat-share"></span></div>
                    </div>

                    <div class="flex items-center gap-2 mb-4 text-sm font-medium text-gray-700 bg-gray-50 p-3 rounded-lg border border-gray-100">
                        <i class="fa-solid fa-music text-purple-500"></i>
                        <span id="music-info" class="truncate"></span>
                    </div>

                    <div class="mb-6 relative">
                        <h4 class="font-semibold text-gray-800 mb-2">Nội dung video:</h4>
                        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 relative group">
                            <p id="video-desc" class="text-gray-700 text-sm whitespace-pre-wrap desc-box max-h-32 overflow-y-auto pr-8"></p>
                            <button onclick="copyDescription()" title="Copy nội dung"
                                class="absolute top-2 right-2 text-gray-400 hover:text-blue-600 transition p-2 bg-white rounded-md shadow-sm border border-gray-100">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-3 mt-4">
                    <a id="btn-download-nowm" href="#" 
                        class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition shadow-md">
                        <i class="fa-solid fa-download"></i> Tải Video (Không Logo)
                    </a>
                    <a id="btn-download-music" href="#" 
                        class="sm:w-auto bg-gray-800 hover:bg-gray-900 text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition shadow-md">
                        <i class="fa-solid fa-music"></i> Tải Nhạc
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script>
        let currentDescription = "";

        // Cơ chế tạo tên file tự động theo yêu cầu: (ID Chủ)_(GiờPhútGiây)_(NgàyThángNăm)_(ID Video)
        function generateCustomFileName(authorId, videoId) {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const timeStr = `${hours}${minutes}${seconds}`;
            
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const dateStr = `${day}${month}${year}`;
            
            return `${authorId}_${timeStr}_${dateStr}_${videoId}`;
        }

        async function fetchVideoData() {
            const linkInput = document.getElementById('tiktok-link').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const resultContainer = document.getElementById('result-container');
            const loading = document.getElementById('loading');
            const fetchBtn = document.getElementById('fetch-btn');

            errorMsg.classList.add('hidden');
            resultContainer.classList.add('hidden');
            
            if (!linkInput) {
                showError("Vui lòng nhập đường dẫn video TikTok!");
                return;
            }

            loading.classList.remove('hidden');
            fetchBtn.disabled = true;
            fetchBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý`;
            fetchBtn.classList.add('opacity-70', 'cursor-not-allowed');

            try {
                // Sử dụng thẳng link API gốc của bạn
                const apiUrl = `https://tiktokvippro.vercel.app/api/video?video=${encodeURIComponent(linkInput)}`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) throw new Error("Lỗi kết nối đến API");
                
                const data = await response.json();

                if (data.status !== "Live" || !data.video_data) {
                    throw new Error("Không thể lấy thông tin video. Link có thể không hợp lệ hoặc video ở chế độ riêng tư.");
                }

                renderData(data);

            } catch (error) {
                showError(error.message);
            } finally {
                loading.classList.add('hidden');
                fetchBtn.disabled = false;
                fetchBtn.innerHTML = `Lấy dữ liệu`;
                fetchBtn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        }

        function renderData(data) {
            document.getElementById('author-avatar').src = data.author.avatar;
            document.getElementById('author-nickname').innerText = data.author.nickname;
            document.getElementById('author-id').innerText = `@${data.author.uniqueId}`;

            document.getElementById('stat-play').innerText = data.stats.play;
            document.getElementById('stat-like').innerText = data.stats.like;
            document.getElementById('stat-comment').innerText = data.stats.comment;
            document.getElementById('stat-share').innerText = data.stats.share;

            document.getElementById('music-info').innerText = `${data.music.title} - ${data.music.author}`;
            
            // Xử lý trình phát video trực tiếp
            const videoPlayer = document.getElementById('main-video-player');
            const videoSource = document.getElementById('video-source');
            videoPlayer.poster = data.urls.cover;
            videoSource.src = data.urls.no_watermark;
            videoPlayer.load();

            currentDescription = data.video_data.description;
            document.getElementById('video-desc').innerText = currentDescription || "Video này không có mô tả.";

            // Cơ chế tải file và gán sự kiện Onclick
            const authorId = data.author.id;
            const videoId = data.video_data.id;
            
            const btnVideo = document.getElementById('btn-download-nowm');
            const btnMusic = document.getElementById('btn-download-music');

            btnVideo.onclick = (e) => {
                e.preventDefault(); // Ngăn trình duyệt nhảy trang
                const filename = generateCustomFileName(authorId, videoId) + '.mp4';
                forceDownload(data.urls.no_watermark, filename, 'btn-download-nowm');
            };

            btnMusic.onclick = (e) => {
                e.preventDefault();
                const filename = generateCustomFileName(authorId, videoId) + '.mp3';
                forceDownload(data.music.playUrl, filename, 'btn-download-music');
            };

            document.getElementById('result-container').classList.remove('hidden');
        }

        // Hàm ép tải dữ liệu thô (Blob) để đổi được tên file
        async function forceDownload(url, filename, buttonId) {
            const btn = document.getElementById(buttonId);
            const originalHTML = btn.innerHTML;
            
            // Đổi UI báo hiệu đang tải
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang tải...`;
            btn.style.pointerEvents = 'none';
            btn.classList.add('opacity-70');

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Fetch failed');
                
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = downloadUrl;
                a.download = filename; 
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(downloadUrl);
                document.body.removeChild(a);
            } catch (error) {
                console.error("Lỗi tải Blob:", error);
                // Nếu fetch() bị từ chối bởi CORS của server chứa video, mở tab mới cho chắc
                window.open(url, '_blank');
            } finally {
                // Khôi phục nút
                btn.innerHTML = originalHTML;
                btn.style.pointerEvents = 'auto';
                btn.classList.remove('opacity-70');
            }
        }

        function showError(message) {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.innerText = message;
            errorMsg.classList.remove('hidden');
        }

        function copyDescription() {
            if (!currentDescription) return;
            navigator.clipboard.writeText(currentDescription).then(() => {
                alert("Đã sao chép nội dung video!");
            }).catch(err => {
                alert("Có lỗi xảy ra khi sao chép: " + err);
            });
        }
    </script>
</body>
</html>
