<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Studio Pro | All-in-One</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: #1a1a1a;
            overflow-x: hidden;
        }

        /* Tùy chỉnh thanh cuộn tinh tế */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        /* Hiệu ứng kính (Glassmorphism) - KHÔNG VIỀN */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
            border: none; 
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }

        /* Style Tab */
        .tab-btn { position: relative; padding-bottom: 0.5rem; transition: color 0.3s ease; }
        .tab-btn::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 0%; height: 2px;
            background-color: #000; transition: width 0.3s ease;
        }
        .tab-active { color: #000; font-weight: 700; }
        .tab-active::after { width: 100%; }
        .tab-inactive { color: #9ca3af; font-weight: 500; }
        .tab-inactive:hover { color: #4b5563; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-12 px-4 sm:px-6 relative">

    <div class="fixed top-[-10%] left-[-10%] w-96 h-96 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob pointer-events-none z-0"></div>
    <div class="fixed top-[20%] right-[-10%] w-96 h-96 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob animation-delay-2000 pointer-events-none z-0"></div>

    <div class="text-center mb-10 w-full max-w-3xl z-10 animate-fade-up">
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-3">
            <i class="fa-brands fa-tiktok text-black mr-2"></i>TikTok <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-violet-500">Studio</span>
        </h1>
        <p class="text-gray-500 font-medium">Bộ công cụ tải đa luồng & phân tích dữ liệu</p>
    </div>

    <div class="w-full max-w-4xl glass-panel rounded-3xl p-6 sm:p-10 z-10 animate-fade-up" style="animation-delay: 0.1s;">
        
        <div class="flex space-x-8 mb-8 border-b border-gray-200/60 pb-1">
            <button onclick="switchTab('video')" id="tab-video" class="tab-btn tab-active focus:outline-none flex items-center gap-2">
                <i class="fa-solid fa-layer-group"></i> Tải Nhiều Video
            </button>
            <button onclick="switchTab('info')" id="tab-info" class="tab-btn tab-inactive focus:outline-none flex items-center gap-2">
                <i class="fa-solid fa-user-astronaut"></i> Tra Cứu Kênh
            </button>
        </div>

        <div id="mode-video" class="transition-opacity duration-500">
            <label class="block text-sm font-semibold text-gray-700 mb-3">Dán link video (Mỗi link 1 dòng, tối đa 10 link để tránh nghẽn)</label>
            <textarea id="tiktok-links" rows="4" placeholder="https://vt.tiktok.com/ZS...&#10;https://www.tiktok.com/@user/video/123..." 
                class="w-full px-5 py-4 bg-white/50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-pink-400 transition-all resize-none mb-5 text-gray-800 placeholder-gray-400 shadow-inner border border-white"></textarea>
            
            <button id="fetch-video-btn" onclick="processVideos()" 
                class="w-full bg-black hover:bg-gray-800 text-white font-bold py-4 px-6 rounded-2xl transition-all transform hover:scale-[1.01] active:scale-95 flex items-center justify-center gap-2 shadow-xl">
                <i class="fa-solid fa-wand-magic-sparkles"></i> <span>Xử Lý Dữ Liệu</span>
            </button>
        </div>

        <div id="mode-info" class="hidden transition-opacity duration-500">
            <label class="block text-sm font-semibold text-gray-700 mb-3">Nhập Username (ID TikTok, không cần @)</label>
            <div class="flex flex-col sm:flex-row gap-3 mb-5">
                <input type="text" id="tiktok-username" placeholder="Ví dụ: hoaa.hanassii" 
                    class="flex-1 px-5 py-4 bg-white/50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-violet-400 transition-all text-gray-800 shadow-inner border border-white">
                <button id="fetch-info-btn" onclick="fetchUserInfo()" 
                    class="bg-violet-600 hover:bg-violet-700 text-white font-bold py-4 px-10 rounded-2xl transition-all transform hover:scale-[1.02] active:scale-95 shadow-xl flex items-center justify-center gap-2">
                    <i class="fa-solid fa-magnifying-glass"></i> Soi
                </button>
            </div>
        </div>

    </div>

    <div id="loading" class="hidden z-10 mt-8 text-center animate-fade-up">
        <div class="inline-flex items-center gap-3 bg-white/80 backdrop-blur-md px-6 py-3 rounded-full shadow-sm text-sm font-semibold text-gray-700">
            <i class="fa-solid fa-circle-notch fa-spin text-pink-500 text-lg"></i>
            <span id="loading-text">Hệ thống đang chạy...</span>
        </div>
    </div>

    <div id="error-msg" class="hidden z-10 mt-6 max-w-2xl bg-red-50 text-red-600 px-6 py-4 rounded-2xl shadow-sm text-center text-sm font-medium animate-fade-up border border-red-100"></div>

    <div id="result-area" class="w-full max-w-5xl z-10 mt-10 space-y-8 flex flex-col items-center pb-20"></div>

    <script>
        let fetchedVideos = []; 

        // ----- ĐIỀU HƯỚNG TABS -----
        function switchTab(mode) {
            document.getElementById('mode-video').classList.toggle('hidden', mode !== 'video');
            document.getElementById('mode-info').classList.toggle('hidden', mode !== 'info');
            
            const btnVideo = document.getElementById('tab-video');
            const btnInfo = document.getElementById('tab-info');
            
            if(mode === 'video') {
                btnVideo.className = 'tab-btn tab-active focus:outline-none flex items-center gap-2';
                btnInfo.className = 'tab-btn tab-inactive focus:outline-none flex items-center gap-2';
            } else {
                btnInfo.className = 'tab-btn tab-active focus:outline-none flex items-center gap-2';
                btnVideo.className = 'tab-btn tab-inactive focus:outline-none flex items-center gap-2';
            }
            clearResults();
        }

        // ----- TIỆN ÍCH UI -----
        function showLoading(show, text = "Đang xử lý...") {
            const loader = document.getElementById('loading');
            document.getElementById('loading-text').innerText = text;
            show ? loader.classList.remove('hidden') : loader.classList.add('hidden');
        }

        function showError(msg) {
            const errEl = document.getElementById('error-msg');
            if(msg) {
                errEl.innerText = msg;
                errEl.classList.remove('hidden');
            } else {
                errEl.classList.add('hidden');
            }
        }

        function clearResults() {
            document.getElementById('result-area').innerHTML = '';
            showError('');
            fetchedVideos = [];
        }

        // Tự tạo tên file đẹp: ID_NgàyTháng_IDVideo
        function generateFileName(author, videoId, ext) {
            const now = new Date();
            const time = `${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
            const date = `${String(now.getDate()).padStart(2,'0')}${String(now.getMonth()+1).padStart(2,'0')}`;
            return `${author}_${date}_${time}_${videoId}.${ext}`;
        }

        // Ép tải file qua Blob để đổi tên file
        async function forceDownload(url, filename, btnObj) {
            const originalHTML = btnObj.innerHTML;
            btnObj.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            btnObj.style.pointerEvents = 'none';

            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = downloadUrl;
                a.download = filename; 
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(downloadUrl);
                a.remove();
            } catch (error) {
                window.open(url, '_blank');
            } finally {
                btnObj.innerHTML = originalHTML;
                btnObj.style.pointerEvents = 'auto';
            }
        }

        // ----- TÍNH NĂNG 1: TẢI NHIỀU VIDEO -----
        async function processVideos() {
            const input = document.getElementById('tiktok-links').value;
            const links = input.split('\n').map(l => l.trim()).filter(l => l !== '');
            
            if (links.length === 0) return showError("Vui lòng dán ít nhất 1 đường link.");
            if (links.length > 10) return showError("Giới hạn 10 link mỗi lần để tránh quá tải máy chủ.");

            clearResults();
            showLoading(true, `Đang bóc tách ${links.length} video...`);
            
            const btn = document.getElementById('fetch-video-btn');
            btn.disabled = true;

            try {
                // Fetch đồng loạt các link tới API hiện tại của bạn
                const promises = links.map(link => 
                    fetch(`/api/video?video=${encodeURIComponent(link)}`)
                    .then(res => res.json())
                    .then(data => ({ link, data }))
                    .catch(err => ({ link, error: err.message }))
                );

                const results = await Promise.all(promises);
                renderVideos(results);

            } catch (error) {
                showError("Lỗi hệ thống: " + error.message);
            } finally {
                showLoading(false);
                btn.disabled = false;
            }
        }

        function renderVideos(results) {
            const container = document.getElementById('result-area');
            let html = '';

            const successfulVids = results.filter(r => r.data && r.data.status === "Live");
            fetchedVideos = successfulVids;

            // Nút Tải Toàn Bộ nếu có > 1 video
            if (successfulVids.length > 1) {
                html += `
                    <div class="w-full flex justify-end animate-fade-up">
                        <button onclick="downloadAllVideos(this)" class="bg-gradient-to-r from-pink-500 to-violet-500 hover:from-pink-600 hover:to-violet-600 text-white font-bold py-3 px-8 rounded-2xl shadow-lg transition transform hover:-translate-y-1 flex items-center gap-2">
                            <i class="fa-solid fa-cloud-arrow-down"></i> Tải Toàn Bộ (${successfulVids.length} Video)
                        </button>
                    </div>
                `;
            }

            results.forEach((item, index) => {
                const delay = index * 0.1;
                
                if (item.error || item.data.status !== "Live") {
                    html += `
                        <div class="w-full glass-panel rounded-2xl p-4 text-red-500 text-sm animate-fade-up flex items-center gap-3" style="animation-delay: ${delay}s">
                            <i class="fa-solid fa-circle-exclamation text-lg"></i>
                            <span>Lỗi lấy video: <span class="opacity-70">${item.link}</span></span>
                        </div>`;
                    return;
                }

                const d = item.data;
                const fileNameMp4 = generateFileName(d.author.uniqueId, d.video_data.id, 'mp4');
                const fileNameMp3 = generateFileName(d.author.uniqueId, d.video_data.id, 'mp3');
                
                // Giao diện thẻ video (Không dùng box frame, dùng divider)
                html += `
                    <div class="w-full glass-panel rounded-3xl overflow-hidden animate-fade-up flex flex-col md:flex-row" style="animation-delay: ${delay}s">
                        <div class="w-full md:w-[35%] bg-black/5 relative aspect-[9/16] max-h-[400px] md:max-h-[500px] flex items-center justify-center">
                            <video controls playsinline class="w-full h-full object-contain" poster="${d.urls.cover}">
                                <source src="${d.urls.no_watermark}" type="video/mp4">
                            </video>
                        </div>
                        
                        <div class="w-full md:w-[65%] p-6 sm:p-8 flex flex-col justify-between divide-y divide-gray-200/50">
                            <div class="pb-6">
                                <div class="flex items-center gap-4 mb-5">
                                    <img src="${d.author.avatar}" class="w-12 h-12 rounded-full object-cover shadow-sm">
                                    <div>
                                        <h3 class="font-bold text-gray-900 text-lg leading-tight">${d.author.nickname}</h3>
                                        <p class="text-sm text-gray-500">@${d.author.uniqueId}</p>
                                    </div>
                                </div>
                                <p class="text-sm text-gray-700 mb-5 leading-relaxed line-clamp-3">${d.video_data.description || 'Không có nội dung mô tả.'}</p>
                                
                                <div class="flex flex-wrap gap-4 text-sm font-medium text-gray-600">
                                    <div class="flex items-center gap-1.5"><i class="fa-solid fa-play text-gray-400"></i> ${d.stats.play}</div>
                                    <div class="flex items-center gap-1.5"><i class="fa-solid fa-heart text-pink-500"></i> ${d.stats.like}</div>
                                    <div class="flex items-center gap-1.5"><i class="fa-solid fa-comment text-blue-400"></i> ${d.stats.comment}</div>
                                </div>
                            </div>

                            <div class="pt-6 flex flex-col sm:flex-row gap-3">
                                <button onclick="forceDownload('${d.urls.no_watermark}', '${fileNameMp4}', this)" 
                                    class="flex-1 bg-black text-white font-semibold py-3.5 rounded-xl hover:bg-gray-800 transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-download"></i> Tải Video
                                </button>
                                <button onclick="forceDownload('${d.music.playUrl}', '${fileNameMp3}', this)" 
                                    class="sm:w-auto px-6 bg-white text-gray-800 font-semibold py-3.5 rounded-xl hover:bg-gray-50 transition flex items-center justify-center gap-2 shadow-sm border border-gray-100">
                                    <i class="fa-solid fa-music text-violet-500"></i> Tải Nhạc
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Logic Tải lần lượt để không crash
        async function downloadAllVideos(btnObj) {
            if (!fetchedVideos || fetchedVideos.length === 0) return;
            
            const originalHTML = btnObj.innerHTML;
            btnObj.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang tải...`;
            btnObj.disabled = true;

            const sleep = ms => new Promise(r => setTimeout(r, ms));

            for (let i = 0; i < fetchedVideos.length; i++) {
                const vid = fetchedVideos[i].data;
                const filename = generateFileName(vid.author.uniqueId, vid.video_data.id, 'mp4');
                
                try {
                    const response = await fetch(vid.urls.no_watermark);
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    a.remove();
                } catch(e) {
                    console.error("Lỗi tải file:", e);
                    window.open(vid.urls.no_watermark, '_blank');
                }
                
                // Nghỉ 1 giây giữa các file để trình duyệt không bị treo
                await sleep(1000); 
            }

            btnObj.innerHTML = `<i class="fa-solid fa-check"></i> Đã Tải Xong`;
            setTimeout(() => {
                btnObj.innerHTML = originalHTML;
                btnObj.disabled = false;
            }, 3000);
        }

        // ----- TÍNH NĂNG 2: SOI THÔNG TIN KÊNH -----
        async function fetchUserInfo() {
            let user = document.getElementById('tiktok-username').value.trim();
            if (user.startsWith('@')) user = user.substring(1);
            if (!user) return showError("Vui lòng nhập ID kênh.");

            clearResults();
            showLoading(true, "Đang trích xuất dữ liệu kênh...");
            
            const btn = document.getElementById('fetch-info-btn');
            btn.disabled = true;

            try {
                // Gọi tới api/index.js của bạn
                const response = await fetch(`/api/index?username=${user}`);
                const data = await response.json();

                if (data.status !== "Live") throw new Error(data.error || "Không tìm thấy dữ liệu kênh. Có thể kênh riêng tư hoặc bị ban.");

                renderUserInfo(data);

            } catch (error) {
                showError(error.message);
            } finally {
                showLoading(false);
                btn.disabled = false;
            }
        }

        function renderUserInfo(data) {
            const container = document.getElementById('result-area');
            const u = data.author;
            const s = data.stats_formatted;

            let html = `
                <div class="w-full max-w-3xl glass-panel rounded-3xl p-8 md:p-12 text-center animate-fade-up relative overflow-hidden">
                    
                    <img src="${u.avatar}" class="w-28 h-28 rounded-full mx-auto object-cover shadow-xl relative z-10">
                    
                    <h2 class="text-3xl font-extrabold mt-5 text-gray-900 flex items-center justify-center gap-2">
                        ${u.nickname} ${u.verified ? '<i class="fa-solid fa-circle-check text-blue-500 text-xl"></i>' : ''}
                    </h2>
                    <p class="text-gray-500 font-medium text-lg mt-1">@${u.uniqueId}</p>
                    
                    ${data.live_info ? `<div class="mt-3 inline-flex items-center gap-2 bg-red-100 text-red-600 px-4 py-1.5 rounded-full text-sm font-bold animate-pulse"><span class="w-2 h-2 rounded-full bg-red-600"></span> ${data.live_info.status}</div>` : ''}

                    <p class="mt-6 text-gray-700 text-base leading-relaxed max-w-xl mx-auto italic whitespace-pre-wrap">${u.signature || 'Chưa có tiểu sử.'}</p>
                    ${u.bioLink ? `<a href="${u.bioLink}" target="_blank" class="block mt-2 text-blue-500 hover:underline text-sm"><i class="fa-solid fa-link mr-1"></i>${u.bioLink}</a>` : ''}
                    
                    <div class="flex justify-center divide-x divide-gray-200 mt-10 pt-8 border-t border-gray-200/60">
                        <div class="px-4 md:px-8 flex flex-col">
                            <span class="text-3xl font-extrabold text-gray-900">${s.following}</span>
                            <span class="text-xs text-gray-500 uppercase tracking-wider mt-1 font-semibold">Đang theo dõi</span>
                        </div>
                        <div class="px-4 md:px-8 flex flex-col">
                            <span class="text-3xl font-extrabold text-gray-900">${s.follower}</span>
                            <span class="text-xs text-gray-500 uppercase tracking-wider mt-1 font-semibold">Follower</span>
                        </div>
                        <div class="px-4 md:px-8 flex flex-col">
                            <span class="text-3xl font-extrabold text-gray-900">${s.heart}</span>
                            <span class="text-xs text-gray-500 uppercase tracking-wider mt-1 font-semibold">Lượt thích</span>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
