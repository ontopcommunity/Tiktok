<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONTOP - Ultra Responsive VIP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --p: #00f2ea; --s: #ff0050; --bg: #020205; }
        body { margin: 0; background: var(--bg); font-family: 'Inter', sans-serif; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        /* Popup & Donate VIP */
        .btn-donate { position: fixed; top: 20px; right: 20px; background: linear-gradient(135deg, #ffd700, #ff8c00); border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; z-index: 100; font-size: 0.8rem; }
        #popup { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(15px); padding: 20px; }
        .popup-box { border: 1px solid var(--p); padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; width: 100%; }

        /* Main UI */
        .home-container { display: none; width: 100%; max-width: 1000px; text-align: center; animation: fadeIn 0.8s; }
        .logo { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 900; letter-spacing: 10px; margin-bottom: 40px; }
        
        /* Grid Tự Điều Chỉnh */
        .selection-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .mini-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px 20px; text-decoration: none; color: white; transition: 0.3s; }
        .mini-card:hover { border-color: var(--p); transform: translateY(-10px); background: rgba(255,255,255,0.07); }
        .mini-card i { font-size: 3rem; margin-bottom: 20px; color: var(--p); }

        /* Modal Donate */
        #donate-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .qr-frame { background: white; padding: 20px; border-radius: 15px; width: 100%; max-width: 320px; text-align: center; color: black; }
        .qr-frame img { width: 100%; border-radius: 10px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Mobile Fix */
        @media (max-width: 600px) {
            .logo { letter-spacing: 5px; }
            .btn-donate { padding: 8px 15px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <button class="btn-donate" onclick="toggleDonate(true)"><i class="fas fa-crown"></i> VIP DONATE</button>

    <div id="popup">
        <div class="popup-box">
            <h2>ONTOP SYSTEM</h2>
            <p style="opacity: 0.5; font-size: 0.9rem; margin-top: 10px;">Hệ thống API TikTok Đa Nền Tảng.</p>
            <button onclick="enter()" style="background:var(--p); border:none; padding:12px 30px; border-radius:5px; margin-top:20px; font-weight:900; cursor:pointer;">KHỞI CHẠY</button>
        </div>
    </div>

    <div id="donate-modal" onclick="toggleDonate(false)">
        <div class="qr-frame" onclick="event.stopPropagation()">
            <img src="https://img.vietqr.io/image/MB-1234210929-compact2.png?amount=0&addInfo=Donate%20ONTOP&accountName=CAO%20NHAT%20MINH">
            <h3 style="margin-top:10px">CAO NHAT MINH</h3>
            <p>MB BANK: 1234210929</p>
        </div>
    </div>

    <div class="home-container" id="main">
        <h1 class="logo">ONTOP</h1>
        <div class="selection-grid">
            <a href="profile-api.html" class="mini-card">
                <i class="fas fa-user-shield"></i>
                <h2>PROFILE</h2>
                <span style="opacity:0.4; font-size:0.7rem;">CRAWLER INFO</span>
            </a>
            <a href="video-api.html" class="mini-card" style="border-bottom: 3px solid var(--s)">
                <i class="fas fa-video" style="color:var(--s)"></i>
                <h2 style="color:var(--s)">VIDEO</h2>
                <span style="opacity:0.4; font-size:0.7rem;">NO-WATERMARK</span>
            </a>
        </div>
    </div>

    <script>
        function enter() { document.getElementById('popup').style.display = 'none'; document.getElementById('main').style.display = 'block'; }
        function toggleDonate(s) { document.getElementById('donate-modal').style.display = s ? 'flex' : 'none'; }
    </script>
</body>
</html>
