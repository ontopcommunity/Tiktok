<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải Âm Thanh TikTok MP3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; min-height: 100vh; color: white; font-family: 'Segoe UI', sans-serif; }
        .tiktok-btn { background: linear-gradient(45deg, #fe2c55, #25f4ee); transition: all 0.2s; }
        .tiktok-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(254,44,85,0.4); }
        .loader {
            border: 3px solid rgba(255,255,255,0.2); border-top: 3px solid white;
            border-radius: 50%; width: 20px; height: 20px;
            animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-gray-800 rounded-2xl p-8 shadow-2xl border border-gray-700">
        <div class="text-center mb-6">
            <i class="fa-brands fa-tiktok text-4xl mb-3" style="color: #25f4ee; filter: drop-shadow(2px 0px 0px #fe2c55);"></i>
            <h1 class="text-2xl font-bold">Tải Nhạc TikTok MP3</h1>
            <p class="text-gray-400 text-sm mt-1">Tải thẳng âm thanh không qua trang trung gian</p>
        </div>

        <div class="space-y-4">
            <input type="text" id="videoUrl" 
                class="w-full px-4 py-4 rounded-xl bg-gray-900 border border-gray-600 text-white outline-none focus:border-[#25f4ee] transition-all"
                placeholder="Dán link video TikTok vào đây...">
            
            <button id="downloadBtn" onclick="processVideo()" class="tiktok-btn w-full font-bold text-white py-4 rounded-xl flex justify-center items-center">
                <span id="btnText"><i class="fa-solid fa-download mr-2"></i> Tải Âm Thanh</span>
                <span id="loading" class="hidden"><div class="loader"></div> Đang tải xuống...</span>
            </button>
        </div>

        <div id="resultArea" class="mt-6 hidden bg-gray-900 p-4 rounded-xl border border-gray-700 text-sm">
            <div id="errorMessage" class="hidden text-red-400 flex items-center">
                <i class="fa-solid fa-circle-exclamation mr-2"></i> <span id="errorText"></span>
            </div>
            <div id="successInfo" class="hidden text-green-400 flex items-center">
                <i class="fa-solid fa-circle-check mr-2"></i> <span>Đã tải thẳng file MP3 về máy!</span>
            </div>
        </div>
    </div>

    <script>
        async function processVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const btnText = document.getElementById('btnText');
            const loading = document.getElementById('loading');
            const downloadBtn = document.getElementById('downloadBtn');
            const resultArea = document.getElementById('resultArea');
            const errorMessage = document.getElementById('errorMessage');
            const successInfo = document.getElementById('successInfo');
            const errorText = document.getElementById('errorText');

            if (!urlInput) return alert("Vui lòng dán link video!");

            // Bật trạng thái loading
            btnText.classList.add('hidden');
            loading.classList.remove('hidden');
            downloadBtn.disabled = true;
            resultArea.classList.add('hidden');
            errorMessage.classList.add('hidden');
            successInfo.classList.add('hidden');

            try {
                // Gọi API của bạn
                const apiUrl = `https://tiktokvippro.vercel.app/api/video?video=${encodeURIComponent(urlInput)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!data.music || !data.music.playUrl) {
                    throw new Error("Không lấy được âm thanh từ video này.");
                }

                // Dọn sạch tên file (xoá đuôi .mp4 nếu vô tình dính)
                const rawTitle = (data.music.title || "tiktok_audio").replace(/\.mp4/gi, '').trim();
                const rawAuthor = (data.music.author || "unknown").replace(/\.mp4/gi, '').trim();
                
                // Tên file chốt hạ chuẩn .mp3
                const finalFileName = `${rawTitle} - ${rawAuthor}.mp3`;
                const playUrl = data.music.playUrl; // Lấy link MP3 của Tikwm

                // Gọi hàm TẢI THẲNG
                await forceDirectDownload(playUrl, finalFileName);

                // Báo thành công
                resultArea.classList.remove('hidden');
                successInfo.classList.remove('hidden');

            } catch (error) {
                resultArea.classList.remove('hidden');
                errorMessage.classList.remove('hidden');
                errorText.textContent = error.message;
            } finally {
                // Tắt trạng thái loading
                btnText.classList.remove('hidden');
                loading.classList.add('hidden');
                downloadBtn.disabled = false;
            }
        }

        // Hàm này đảm bảo tuyệt đối không mở tab mới, chỉ tải thẳng
        async function forceDirectDownload(url, filename) {
            try {
                // Bước 1: Kéo trực tiếp dữ liệu âm thanh về RAM
                let res = await fetch(url);
                
                // Bước 2: Nếu bị chặn CORS, đi vòng qua proxy corsproxy.io để kéo dữ liệu
                if (!res.ok) {
                    res = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
                }

                if (!res.ok) throw new Error("Không thể kéo dữ liệu nhạc.");

                const blob = await res.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                // Bước 3: Tạo lệnh tải thẳng xuống ổ cứng
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename; // Bắt buộc lưu đúng tên file và đuôi .mp3
                
                document.body.appendChild(a);
                a.click();
                
                // Dọn dẹp bộ nhớ
                setTimeout(() => {
                    URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(a);
                }, 1000);

            } catch (err) {
                console.error("Lỗi khi ép tải thẳng:", err);
                throw new Error("Bảo mật mạng chặn tải ngầm. Vui lòng thử lại!");
            }
        }
    </script>
</body>
</html>
