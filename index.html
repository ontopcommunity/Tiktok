<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải Âm Thanh TikTok Chuẩn MP3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #0f172a;
            min-height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        .tiktok-btn {
            background: #fe2c55;
            transition: opacity 0.2s;
        }
        .tiktok-btn:hover:not(:disabled) {
            opacity: 0.9;
        }
        .loader {
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-gray-800 rounded-xl p-8 shadow-2xl">
        <h1 class="text-2xl font-bold text-center mb-6">Tải Nhạc TikTok MP3</h1>

        <div class="space-y-4">
            <input type="text" id="videoUrl" 
                class="w-full px-4 py-3 rounded bg-gray-900 border border-gray-700 text-white outline-none focus:border-red-500"
                placeholder="Dán link TikTok vào đây...">
            
            <button id="downloadBtn" onclick="processVideo()" class="tiktok-btn w-full font-bold text-white py-3 rounded flex justify-center items-center">
                <span id="btnText"><i class="fa-solid fa-download mr-2"></i> Trích xuất & Tải MP3</span>
                <span id="loading" class="hidden"><div class="loader"></div> Đang xử lý file MP3...</span>
            </button>
        </div>

        <div id="resultArea" class="mt-6 hidden bg-gray-900 p-4 rounded border border-gray-700 text-sm">
            <div id="errorMessage" class="hidden text-red-500"></div>
            <div id="successInfo" class="hidden text-green-400">
                <i class="fa-solid fa-check mr-1"></i> Đã đóng gói và tải xuống file đuôi .mp3
            </div>
        </div>
    </div>

    <script>
        async function processVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const btnText = document.getElementById('btnText');
            const loading = document.getElementById('loading');
            const downloadBtn = document.getElementById('downloadBtn');
            const resultArea = document.getElementById('resultArea');
            const errorMessage = document.getElementById('errorMessage');
            const successInfo = document.getElementById('successInfo');

            if (!urlInput) return alert("Vui lòng dán link!");

            // Reset UI
            btnText.classList.add('hidden');
            loading.classList.remove('hidden');
            downloadBtn.disabled = true;
            resultArea.classList.add('hidden');
            errorMessage.classList.add('hidden');
            successInfo.classList.add('hidden');

            try {
                // Gọi API của bạn
                const apiUrl = `https://tiktokvippro.vercel.app/api/video?video=${encodeURIComponent(urlInput)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!data.music || !data.music.playUrl) {
                    throw new Error("Không tìm thấy luồng âm thanh.");
                }

                // Dọn dẹp tên file, tuyệt đối không chứa .mp4
                let rawTitle = (data.music.title || "audio").replace(/\.mp4/gi, '');
                let rawAuthor = (data.music.author || "tiktok").replace(/\.mp4/gi, '');
                
                // Tên file cuối cùng CỐ ĐỊNH đuôi .mp3
                const finalFileName = `${rawTitle} - ${rawAuthor}.mp3`;
                
                // Chuẩn bị URL gốc
                const rawUrl = data.music.playUrl;

                // Tiến hành ép tải
                await forceStrictMp3Download(rawUrl, finalFileName);

                resultArea.classList.remove('hidden');
                successInfo.classList.remove('hidden');

            } catch (error) {
                resultArea.classList.remove('hidden');
                errorMessage.classList.remove('hidden');
                errorMessage.textContent = "Lỗi: " + error.message;
            } finally {
                btnText.classList.remove('hidden');
                loading.classList.add('hidden');
                downloadBtn.disabled = false;
            }
        }

        async function forceStrictMp3Download(url, filename) {
            try {
                // Sử dụng proxy để tránh lỗi CORS chặn việc tải file dưới dạng Blob
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Không thể tải file qua luồng trung gian.");
                
                const rawBlob = await response.blob();
                
                // ÉP KIỂU BLOB THÀNH AUDIO/MPEG (MP3)
                const mp3Blob = new Blob([rawBlob], { type: 'audio/mpeg' });
                const blobUrl = window.URL.createObjectURL(mp3Blob);
                
                // Tạo thẻ a và ép buộc thuộc tính download có đuôi .mp3
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename; 
                
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    window.URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(a);
                }, 2000);

            } catch (err) {
                throw new Error("Hệ thống mạng chặn tải file định dạng này. Vui lòng thử lại.");
            }
        }
    </script>
</body>
</html>
