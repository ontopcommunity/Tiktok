<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Profile VIP</title>
    <style>
        :root { --p: #00f2ea; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; flex-direction: row; height: 100vh; }
        
        .sidebar { width: 350px; border-right: 1px solid rgba(255,255,255,0.1); padding: 30px; display: flex; flex-direction: column; overflow-y: auto; }
        .main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        
        input { width: 100%; padding: 15px; background: #111; border: 1px solid #333; border-radius: 10px; color: white; margin: 10px 0; }
        .btn { width: 100%; padding: 15px; background: var(--p); border: none; font-weight: bold; border-radius: 10px; cursor: pointer; }

        .profile-card { background: rgba(255,255,255,0.03); border: 1px solid var(--p); padding: 30px; border-radius: 20px; display: flex; align-items: center; gap: 30px; flex-wrap: wrap; }
        .avatar { width: 150px; height: 150px; border-radius: 50%; border: 3px solid var(--p); }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; width: 100%; }
        .s-item { background: #111; padding: 15px; border-radius: 10px; text-align: center; }
        
        .json-box { background: #000; padding: 20px; border-radius: 15px; border: 1px solid #222; font-family: monospace; color: var(--p); font-size: 0.8rem; overflow-x: auto; }

        /* RESPONSIVE MOBILE */
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #333; }
            .avatar { width: 100px; height: 100px; margin: 0 auto; }
            .profile-card { text-align: center; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="index.html" style="color:var(--p); text-decoration:none">← HOME</a>
        <h2 style="margin-top:20px">PROFILE SETTINGS</h2>
        <input type="text" id="userInput" placeholder="Nhập username...">
        <button class="btn" onclick="fetchData()">QUÉT DỮ LIỆU</button>
        <div id="url" style="font-size:0.6rem; opacity:0.4; margin-top:20px; word-break:break-all"></div>
    </div>
    <div class="main">
        <div class="profile-card" id="res" style="display:none">
            <img id="avt" class="avatar">
            <div>
                <h1 id="nick" style="margin:0">Nickname</h1>
                <p id="bio" style="opacity:0.6"></p>
                <div id="live" style="color:red; font-weight:bold"></div>
            </div>
            <div class="stats">
                <div class="s-item"><small>Followers</small><br><b id="sf">-</b></div>
                <div class="s-item"><small>Hearts</small><br><b id="sh">-</b></div>
                <div class="s-item"><small>Videos</small><br><b id="sv">-</b></div>
            </div>
        </div>
        <div class="json-box"><pre id="jsonOut">// Dữ liệu thô JSON</pre></div>
    </div>
    <script>
        window.onload = () => { const u = new URLSearchParams(window.location.search).get('username'); if(u) fetchData(u); };
        async function fetchData(u) {
            const user = u || document.getElementById('userInput').value; if(!user) return;
            document.getElementById('url').innerText = window.location.origin + "/api?username=" + user;
            const r = await fetch(`/api?username=${user}`);
            const d = await r.json();
            document.getElementById('jsonOut').innerText = JSON.stringify(d, null, 4);
            if(d.status === "Live") {
                document.getElementById('res').style.display = 'flex';
                document.getElementById('avt').src = d.avatar;
                document.getElementById('nick').innerText = d.nickname;
                document.getElementById('bio').innerText = d.bio || "";
                document.getElementById('sf').innerText = d.stats.follower;
                document.getElementById('sh').innerText = d.stats.heart;
                document.getElementById('sv').innerText = d.stats.video;
                document.getElementById('live').innerText = d.live_status || "";
            }
        }
    </script>
</body>
</html>
