<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Video VIP</title>
    <style>
        :root { --p: #ff0050; --s: #00f2ea; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; height: 100vh; }
        
        .sidebar { width: 350px; border-right: 1px solid #333; padding: 30px; display: flex; flex-direction: column; }
        .main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        
        input { width: 100%; padding: 15px; background: #000; border: 1px solid #333; border-radius: 10px; color: white; margin: 15px 0; }
        .btn { width: 100%; padding: 15px; background: var(--p); border: none; font-weight: bold; border-radius: 10px; cursor: pointer; color: white; }

        .video-content { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .player-box { background: #000; border-radius: 15px; overflow: hidden; height: 600px; border: 1px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .info-card { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 20px; border: 1px solid var(--p); }
        .stats-v { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .v-item { background: #111; padding: 15px; border-radius: 10px; text-align: center; font-size: 0.9rem; }
        .v-item b { color: var(--s); }

        .json-box { background: #000; padding: 20px; border-radius: 15px; border: 1px solid #222; font-family: monospace; color: var(--s); font-size: 0.7rem; overflow-x: auto; }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #333; }
            .video-content { grid-template-columns: 1fr; }
            .player-box { height: 450px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="index.html" style="color:var(--s); text-decoration:none">← HOME</a>
        <h2 style="margin-top:20px">VIDEO SETTINGS</h2>
        <input type="text" id="vInput" placeholder="Dán link video TikTok...">
        <button class="btn" onclick="fetchVideo()">TRUY XUẤT VIDEO</button>
        <div id="vUrl" style="font-size:0.6rem; opacity:0.4; margin-top:20px; word-break:break-all"></div>
    </div>
    <div class="main">
        <div class="video-content">
            <div class="player-box">
                <video id="player" controls></video>
            </div>
            <div class="info-card">
                <div style="display:flex; align-items:center; gap:10px">
                    <img id="vAvt" style="width:50px; height:50px; border-radius:50%; border:2px solid var(--s)">
                    <h3 id="vNick">Author</h3>
                </div>
                <p id="vDesc" style="font-size:0.8rem; opacity:0.7; margin-top:10px"></p>
                <div class="stats-v">
                    <div class="v-item">VIEWS<br><b id="v1">-</b></div>
                    <div class="v-item">LIKES<br><b id="v2">-</b></div>
                    <div class="v-item">CMTS<br><b id="v3">-</b></div>
                    <div class="v-item">SHARES<br><b id="v4">-</b></div>
                </div>
                <div id="vDl" style="margin-top:15px; padding:10px; background:#000; font-size:0.7rem; border:1px dashed var(--s); word-break:break-all">Link No-WM</div>
            </div>
        </div>
        <div class="json-box"><pre id="vJson">// JSON Response</pre></div>
    </div>
    <script>
        window.onload = () => { const v = new URLSearchParams(window.location.search).get('video'); if(v) fetchVideo(v); };
        async function fetchVideo(v) {
            const link = v || document.getElementById('vInput').value; if(!link) return;
            document.getElementById('vUrl').innerText = window.location.origin + "/api/video?video=" + encodeURIComponent(link);
            const r = await fetch(`/api/video?video=${encodeURIComponent(link)}`);
            const d = await r.json();
            document.getElementById('vJson').innerText = JSON.stringify(d, null, 4);
            if(d.status === "Live") {
                document.getElementById('player').src = d.video.noWatermark;
                document.getElementById('vAvt').src = d.author.avatar;
                document.getElementById('vNick').innerText = d.author.nickname;
                document.getElementById('vDesc').innerText = d.desc;
                document.getElementById('v1').innerText = d.stats.play;
                document.getElementById('v2').innerText = d.stats.like;
                document.getElementById('v3').innerText = d.stats.comment;
                document.getElementById('v4').innerText = d.stats.share;
                document.getElementById('vDl').innerText = d.video.noWatermark;
            }
        }
    </script>
</body>
</html>
