<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONTOP - API VIDEO TIKTOK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --p: #ff0050; --s: #00f2ea; --bg: #020205; --card: rgba(255, 255, 255, 0.02); }
        body { margin: 0; background: var(--bg); font-family: 'Inter', sans-serif; color: white; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 380px; border-right: 1px solid rgba(255,255,255,0.05); padding: 40px 30px; display: flex; flex-direction: column; backdrop-filter: blur(20px); }
        input { width: 100%; padding: 18px; background: #000; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; margin-bottom: 20px; }
        .btn-call { width: 100%; padding: 18px; background: var(--p); border: none; border-radius: 12px; font-weight: 900; cursor: pointer; color: white; }

        .main { flex: 1; padding: 40px; overflow-y: auto; display: grid; grid-template-columns: 450px 1fr; gap: 30px; }
        .video-box { background: #000; border-radius: 30px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); height: 750px; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .data-panel { display: flex; flex-direction: column; gap: 25px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .stat-card b { font-size: 1.5rem; color: var(--s); }
        
        .json-viewer { background: #000; border-radius: 20px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); font-family: 'Consolas', monospace; color: var(--s); font-size: 0.8rem; height: 300px; overflow-y: auto; }
        .dl-box { padding: 20px; background: rgba(0,242,234,0.05); border: 1px dashed var(--s); border-radius: 15px; font-size: 0.75rem; word-break: break-all; }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="index.html" style="font-size: 1.5rem; font-weight: 900; letter-spacing: 5px; color: var(--p); text-decoration: none; margin-bottom: 40px;">ONTOP</a>
        <h2>VIDEO API</h2>
        <input type="text" id="vInput" placeholder="Dán link video TikTok...">
        <button class="btn-call" onclick="fetchVideo()">EXTRACT VIDEO</button>
        
        <div style="margin-top: auto; font-size: 0.7rem; opacity: 0.4;">
            <b>ACTIVE LINK:</b><br>
            <span id="urlDisplay">N/A</span>
        </div>
    </div>

    <div class="main">
        <div class="video-box">
            <video id="player" controls poster=""></video>
        </div>

        <div class="data-panel">
            <div style="background: var(--card); padding: 30px; border-radius: 25px; border: 1px solid var(--p);">
                <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                    <img id="avt" src="https://via.placeholder.com/50" style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--s);">
                    <h3 id="nick" style="margin: 0;">Author</h3>
                </div>
                <p id="desc" style="opacity: 0.7; font-size: 0.9rem;">Mô tả video...</p>
            </div>

            <div class="stat-grid">
                <div class="stat-card"><small>LIKES</small><br><b id="s-like">-</b></div>
                <div class="stat-card"><small>VIEWS</small><br><b id="s-play">-</b></div>
                <div class="stat-card"><small>COMMENTS</small><br><b id="s-comment">-</b></div>
                <div class="stat-card"><small>SHARES</small><br><b id="s-share">-</b></div>
            </div>

            <div class="dl-box">
                <b style="color: var(--s)">NO-WATERMARK LINK:</b><br>
                <span id="dl-link">-</span>
            </div>

            <div class="json-viewer"><pre id="jsonOutput">// Raw JSON Data Area</pre></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const vLink = urlParams.get('video');
            if(vLink) {
                document.getElementById('vInput').value = vLink;
                fetchVideo(vLink);
            }
        };

        async function fetchVideo(directLink) {
            const link = directLink || document.getElementById('vInput').value;
            if(!link) return;

            document.getElementById('urlDisplay').innerText = window.location.origin + "/api/video?video=" + encodeURIComponent(link);

            try {
                const res = await fetch(`/api/video?video=${encodeURIComponent(link)}`);
                const d = await res.json();
                document.getElementById('jsonOutput').innerText = JSON.stringify(d, null, 4);

                if(d.status === "Live") {
                    document.getElementById('player').src = d.video.noWatermark;
                    document.getElementById('avt').src = d.author.avatar;
                    document.getElementById('nick').innerText = d.author.nickname;
                    document.getElementById('desc').innerText = d.desc;
                    document.getElementById('s-like').innerText = d.stats.like;
                    document.getElementById('s-play').innerText = d.stats.play;
                    document.getElementById('s-comment').innerText = d.stats.comment;
                    document.getElementById('s-share').innerText = d.stats.share;
                    document.getElementById('dl-link').innerText = d.video.noWatermark;
                }
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
